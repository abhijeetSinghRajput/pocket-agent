# Render Blueprint: Pocket Agent API + Postgres + Redis (Key Value).
# Create it in the Render dashboard: New → Blueprint → pick this repository.
# Secrets are never in this file: values marked `sync: false` are entered in the dashboard, and the
# Firebase key is uploaded as a Secret File named fcm.json (see docs/deployment.md).

services:
  - type: web
    name: pocket-agent-api
    runtime: node
    # Free plan for testing. It sleeps after 15 min without traffic (the PC agent's heartbeat usually
    # keeps it awake). For real use switch to `starter`: always on, and pre-deploy migrations.
    plan: free
    region: singapore
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile --prod=false &&
      pnpm build:packages &&
      pnpm --filter @pocket-agent/api --fail-if-no-match build
    # Free instances can't run a preDeployCommand, so migrations run on start (idempotent).
    startCommand: pnpm --filter @pocket-agent/api --fail-if-no-match db:deploy && node apps/api/dist/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: pocket-agent-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pocket-agent-redis
          property: connectionString
      # The dashboard's origin, e.g. https://pocket-agent.vercel.app (comma-separate several).
      - key: WEB_ORIGINS
        sync: false
      # Set to false after creating your own account, so nobody else can sign up.
      - key: REGISTRATION_ENABLED
        value: 'true'
      # Upload the service-account JSON as Secret File "fcm.json"; Render mounts it here.
      - key: FCM_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/fcm.json

  - type: keyvalue
    name: pocket-agent-redis
    plan: free
    region: singapore
    # Only reachable from services in this Render account.
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: pocket-agent-db
    # Free for testing: Render deletes free databases after 30 days. Use basic-256mb (or an
    # external Postgres) before relying on it.
    plan: free
    region: singapore
    databaseName: pocket_agent
    postgresMajorVersion: '17'
    # Only reachable from services in this Render account.
    ipAllowList: []
