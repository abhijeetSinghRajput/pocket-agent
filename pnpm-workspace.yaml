packages:
  - apps/*
  - packages/*
  # The Expo app is its own npm project (own lockfile): the API/web deploys don't install React Native.
  - '!apps/mobile'
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  # Optional postinstall steps; firebase works without them.
  '@firebase/util': false
  protobufjs: false
